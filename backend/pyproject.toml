[project]
name = "qianyue-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.16.1",
    "fastapi>=0.162.7",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.17.5",
]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
